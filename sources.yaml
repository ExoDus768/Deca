# Explorer is enabled after a successful authenticated fetch. Other candidates remain disabled until their schemas and metric scopes are verified.
# Never treat two dashboards as independent merely because they publish different URLs.
sources:
  intents_explorer:
    enabled: true
    url: "https://explorer.near-intents.org/api/v0/transactions?numberOfTransactions=1000"
    auth_env: "NEAR_INTENTS_EXPLORER_TOKEN"
    format: json
    lineage_class: "first_party_explorer"
    notes: "Official Explorer API. Read-only historical 1Click swaps; requires partner JWT. Public swaps only; does not include confidential volume."
  defillama_intents:
    enabled: true
    optional: true
    url: "https://api.llama.fi/summary/dexs/near-intents?excludeTotalDataChart=false&excludeTotalDataChartBreakdown=true&dataType=dailyVolume"
    format: json
    lineage_class: "independent_provider_context"
    notes: "DefiLlama daily DEX spot-swap volume. Pulled as separate context only; broader inclusion scope is not assumed to match public 1Click Explorer rows."
  defillama_intents_fees:
    enabled: true
    optional: true
    url: "https://api.llama.fi/summary/fees/near-intents?dataType=dailyFees"
    format: json
    lineage_class: "independent_provider_context"
    notes: "DefiLlama NEAR Intents fee adapter: gross swap fees across integrators, sourced from Dune and NEAR on-chain fee records."
  defillama_intents_revenue:
    enabled: true
    optional: true
    url: "https://api.llama.fi/summary/fees/near-intents?dataType=dailyRevenue"
    format: json
    lineage_class: "independent_provider_context"
    notes: "DefiLlama NEAR Intents net captured revenue, based on NEAR revenue-wallet sweeps; distinct from gross fees."
  defillama_intents_protocol_revenue:
    enabled: true
    optional: true
    url: "https://api.llama.fi/summary/fees/near-intents?dataType=dailyProtocolRevenue"
    format: json
    lineage_class: "independent_provider_context"
    notes: "DefiLlama NEAR Intents protocol revenue retained in treasury before the buyback program; expected to be zero after buybacks began."
  defillama_intents_holders_revenue:
    enabled: true
    optional: true
    url: "https://api.llama.fi/summary/fees/near-intents?dataType=dailyHoldersRevenue"
    format: json
    lineage_class: "independent_provider_context"
    notes: "DefiLlama NEAR Intents holder revenue represented by NEAR buybacks since 2026-02-23; buybacks are not burns."
  nearblocks_intents_dashboard:
    enabled: false
    url: "TODO_FIND_DOCUMENTED_NEARBLOCKS_INTENTS_API"
    format: json
    lineage_class: "independent_indexer_candidate"
    notes: "NearBlocks publishes a NEAR Intents dashboard, but a stable documented API endpoint and exact inclusion rules still need verification."
  nearstats_summary:
    enabled: false
    url: "https://nearstats.org/api/near/summary"
    format: json
    lineage_class: "derived_aggregator"
    notes: "Public JSON endpoint. Not an independent source for headline volume: its methodology says totals use NEAR first-party daily figures and its public component matches the Explorer; useful as a methodology/cross-check target only."
  near_rpc_status:
    enabled: false
    url: "https://rpc.mainnet.near.org"
    method: POST
    body:
      jsonrpc: "2.0"
      id: "deca"
      method: status
      params: []
    format: json
    lineage_class: "protocol_rpc"
    notes: "Network health/context only; not an Intents volume source."

# Metric peers must share the same scope, unit, date boundaries and inclusion rules.
# These are hypotheses until the adapters and lineage audit are complete.
metrics:
  intents_daily_volume_usd:
    sources: [intents_explorer]
    unit: USD
    tolerance_pct: 10
    definition: "Daily USD notional volume from public 1Click Explorer records, with DefiLlama NEAR Intents DEX volume surfaced separately as a scope-mismatch diagnostic."
  daily_transactions:
    sources: [nearblocks_intents_dashboard, intents_explorer]
    unit: transactions
    tolerance_pct: 5
    definition: "Daily successful swap/settlement count; align status filters and de-duplication rules before comparing."
