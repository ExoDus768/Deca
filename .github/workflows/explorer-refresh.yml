name: Explorer API refresh

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Fetch latest NEAR Intents Explorer transactions
        env:
          NEAR_INTENTS_EXPLORER_TOKEN: ${{ secrets.NEAR_INTENTS_EXPLORER_TOKEN }}
          DECA_EXPLORER_MAX_PAGES: "100"
        run: python src/snapshot.py
      - name: Normalize successful settlements
        run: python src/normalize_explorer.py
      - name: Publish reconciliation output
        run: make publish
      - name: Commit latest public metrics
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Publish latest verified Explorer metrics"
          file_pattern: "data/metrics/*.json published/reconciliation.json"
      - name: Upload raw and normalized evidence
        uses: actions/upload-artifact@v4
        with:
          name: near-intents-explorer-snapshot
          path: |
            data/raw/intents_explorer/
            data/metrics/
            data/manifest.json
          if-no-files-found: error
          retention-days: 14
