name: Explorer API refresh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Fetch latest NEAR Intents Explorer transactions
        env:
          NEAR_INTENTS_EXPLORER_TOKEN: ${{ secrets.NEAR_INTENTS_EXPLORER_TOKEN }}
        run: python src/snapshot.py
      - name: Upload raw Explorer snapshot
        uses: actions/upload-artifact@v4
        with:
          name: near-intents-explorer-snapshot
          path: |
            data/raw/intents_explorer/
            data/manifest.json
          if-no-files-found: error
          retention-days: 14
